name: shellcheck

on:
  push:
    paths:
      - 'src/*'
      - '.github/workflows/shellcheck.yml'
  pull_request:

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck
      - name: Run shellcheck
        run: shellcheck -S error src/ulog.sh src/ulog-genconfig src/ulog-export src/ulog-common.sh
